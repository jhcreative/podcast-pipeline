# RockstarPodcast — tooling config. The pipeline is the `rockstar` package, run from the checkout with `python -m`;
# it is not installed, so there is no [project] table.

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py collects each test_*.py as ONE item run in its own process (the suites swap modules in
# sys.modules for fakes); pytest's own Python collection is switched off so nothing is imported twice.
python_files = []
markers = [
  "live: calls the real Anthropic API; run with `pytest -m live` and ANTHROPIC_API_KEY set",
  "private: needs the private denylist (DENYLIST_PATH); skipped where it is absent",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# E501: long assertion messages and fixture lines read better whole (backlog: wrap them).
# E402: a suite installs its fakes (sys.modules, env) BEFORE it imports the pipeline, by design.
"tests/*" = ["E501", "E402"]
