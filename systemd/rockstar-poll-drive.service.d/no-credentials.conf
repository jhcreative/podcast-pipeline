# BLOG-02 — Orly N-1: this unit runs as the SAME uid (rockstar) as the worker, and
# systemd makes the worker's LoadCredential copy (/run/credentials/rockstar-worker.service/
# tailor_blog) readable by that uid. Without this, a compromise of rockstar-poll-drive
# could read the Tailor blog password. Masking both trees gives this unit a mode-000 view
# of them, which also blocks credential mounts that appear under /run/credentials later.
#
# NO "-" prefix, on purpose: with "-", a path missing when this unit starts silently
# disables the rule (the webhook starts BEFORE the worker creates its credential mount).
# The paths are guaranteed to exist by systemd/tmpfiles.d/rockstar-credentials.conf,
# installed as /etc/tmpfiles.d/rockstar-credentials.conf (runbook step 8).
# Verify (a oneshot has no MainPID between runs): systemctl show -p InaccessiblePaths rockstar-poll-drive
#   lists /run/credentials and /etc/rockstar-pipeline.
[Service]
InaccessiblePaths=/run/credentials /etc/rockstar-pipeline
