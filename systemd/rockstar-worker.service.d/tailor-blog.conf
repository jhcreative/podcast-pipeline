# BLOG-02 — the Tailor blog credential, for the WORKER ONLY (Orly C-10).
#
# systemd copies the file into the worker's private $CREDENTIALS_DIRECTORY/tailor_blog
# (read by blog_publish.load_credentials). The password therefore never enters the
# process environment, never reaches ffmpeg/whisperx children, and is never visible to
# rockstar-webhook.service, which loads the shared /opt/rockstar-pipeline/.env.
#
# !! /etc/rockstar-pipeline/tailor-blog.env MUST EXIST (root:root, 0600) BEFORE ANY
# !! `systemctl daemon-reload` + restart of rockstar-worker. If it is missing, systemd
# !! refuses to start the unit, and the WHOLE worker is down (every job type, not only
# !! the blog step). Install order is in docs/runbooks/blog02-deploy.md.
#
# Keys in the file: TAILOR_BLOG_EMAIL, TAILOR_BLOG_PASSWORD. Never in the repo, the
# deploy FILES list, .env, Drive, an alert or a carry-forward note.
[Service]
LoadCredential=tailor_blog:/etc/rockstar-pipeline/tailor-blog.env
