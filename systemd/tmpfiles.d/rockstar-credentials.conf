# BLOG-02 — Orly N-1. Install as /etc/tmpfiles.d/rockstar-credentials.conf.
# The webhook / poll-drive / renew-watches drop-ins mask these paths with
# InaccessiblePaths= WITHOUT the "-" prefix, so both must exist before any of those
# units start — at every boot, before the worker has created its credential mount.
# /run is a tmpfs, so /run/credentials is recreated here on each boot.
d /run/credentials 0755 root root -
# The credential directory (runbook step 7 creates it 0700 root:root). Listed so a unit
# never fails to start on a box where it is missing; tmpfiles keeps it 0700 root:root.
# !! Keep this a lowercase `d` with age `-` (Orly, addendum): it creates or re-modes the
# !! directory and NEVER touches what is inside. `D`, `e`, or any age can delete the
# !! credential file. Run only `systemd-tmpfiles --create <this file>` — never a bare
# !! `--create --remove`.
d /etc/rockstar-pipeline 0700 root root -
